name: Diagnose library
on:
  push:
    branches: [diag]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h /
      - uses: actions/checkout@v5
      - name: Download and unpack the library
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download latest --pattern 'SeforimLibrary.sqlite.xz.part*' -D parts --repo ${{ github.repository }}
          cat $(ls parts/* | sort) | xz -d -T0 > lib.sqlite; ls -la lib.sqlite
      - run: python3 tools/diag_library.py lib.sqlite
