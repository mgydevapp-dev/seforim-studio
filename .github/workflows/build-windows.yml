# Builds the portable Windows app, tests the real .exe by clicking through it in Microsoft Edge,
# publishes the test results (branch "ci-results") and the downloads (release "latest").
# Put "[library]" in a commit message (or run manually with build_library) to also rebuild the full library.
name: Build portable Windows exe
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_library:
        description: "Also rebuild the complete pre-downloaded library (takes ~1-3 hours)"
        type: boolean
        default: false
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Build the portable app
        shell: pwsh
        run: ./build_portable.ps1

      - name: Test the real exe (click through every screen in Edge)
        id: test
        continue-on-error: true
        shell: pwsh
        run: |
          $py = "_build\python\python.exe"
          if (-not (Test-Path $py)) { $py = "python" }
          & $py -m pip install playwright --quiet
          $data = Join-Path $env:RUNNER_TEMP "testdata"
          Copy-Item "SeforimStudio-Portable\data" $data -Recurse
          $env:TEST_DATA = $data
          $env:PYTHONIOENCODING = "utf-8"
          & $py tests\windows_ui_test.py "SeforimStudio-Portable\SeforimStudio.exe" "ci-results"
          if ($LASTEXITCODE -ne 0) { throw "some checks failed - see ci-results/report.md" }

      - name: Publish test results (branch ci-results)
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory ci-results -Force | Out-Null
          if (-not (Test-Path ci-results\report.md)) { "The test did not finish - see the build log." | Set-Content ci-results\report.md }
          "${{ github.sha }} $(Get-Date -Format o)" | Set-Content ci-results\built.txt
          $d = Join-Path $env:RUNNER_TEMP "results"
          New-Item -ItemType Directory $d -Force | Out-Null
          Copy-Item ci-results\* $d -Recurse -Force
          Push-Location $d
          git init -q -b ci-results
          git config user.name "build-bot"; git config user.email "build-bot@users.noreply.github.com"
          git add -A; git commit -q -m "Test results for ${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { throw "commit failed" }
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-results
          Pop-Location

      - name: Publish the app (release "latest")
        if: steps.test.outcome == 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          **Seforim Studio - portable Windows app (no install, works offline)**

          1. Download **SeforimStudio-Portable.zip** and unzip it.
          2. Download ALL the **SeforimLibrary.sqlite.xz.part...** files (the complete library: every sefer in Hebrew + English with cross-references) and put them in the unzipped **SeforimStudio-Portable** folder, next to SeforimStudio.exe.
          3. Double-click **SeforimStudio.exe** - it installs the library once (a few minutes). Then you may delete the part files.
          4. Copy the whole SeforimStudio-Portable folder to any offline computer.

          Already inside the app: Hebrew titles of all seforim, 50+ Hebrew fonts, Tesseract Hebrew reader for the scanner.
          Built from commit ${{ github.sha }} - tested automatically on Windows.
          "@
          gh release view latest *> $null
          if ($LASTEXITCODE -ne 0) { gh release create latest --title "Seforim Studio - portable Windows app" --notes "$notes" }
          else { gh release edit latest --notes "$notes" }
          gh release upload latest SeforimStudio-Portable.zip --clobber

  library:
    if: (github.event_name == 'workflow_dispatch' && inputs.build_library) || contains(github.event.head_commit.message, '[library]')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Download every sefer + titles + cross-references into one library
        run: python tools/prebuild_library.py --out build/library.sqlite --links --workers 24
      - name: Compress and split (GitHub allows 2 GB per file)
        run: |
          cd build
          ls -la
          xz -T0 -6 -k -c library.sqlite > SeforimLibrary.sqlite.xz
          ls -la SeforimLibrary.sqlite.xz
          split -b 1900M -d -a 1 SeforimLibrary.sqlite.xz part_
          n=$(ls part_* | wc -l); i=1
          for f in $(ls part_* | sort); do mv "$f" "SeforimLibrary.sqlite.xz.part${i}of${n}"; i=$((i+1)); done
          rm SeforimLibrary.sqlite.xz
          ls -la
      - name: Publish the library (release "latest")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest > /dev/null 2>&1 || gh release create latest --title "Seforim Studio - portable Windows app" --notes "Building…"
          for a in $(gh release view latest --json assets -q '.assets[].name' | grep '^SeforimLibrary' || true); do gh release delete-asset latest "$a" -y; done
          gh release upload latest build/SeforimLibrary.sqlite.xz.part* build/library_report.txt --clobber
