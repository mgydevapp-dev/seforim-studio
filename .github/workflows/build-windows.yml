# Every push builds SeforimStudio-Portable.zip (download from the Actions tab -> latest run -> Artifacts).
name: Build portable Windows exe
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        shell: pwsh
        run: ./build_portable.ps1
      - name: Smoke test (start the exe, check it answers)
        shell: pwsh
        run: |
          $p = Start-Process "SeforimStudio-Portable\SeforimStudio.exe" -ArgumentList "--no-window","--port","8799" -PassThru
          Start-Sleep -Seconds 12
          $r = Invoke-WebRequest "http://127.0.0.1:8799/" -UseBasicParsing
          if ($r.Content -notmatch "Seforim Studio") { throw "app did not answer" }
          Write-Host "App answered OK ($($r.Content.Length) bytes)"
          $t = $r.Content | Select-String 'TOKEN = "([^"]+)"' | % { $_.Matches[0].Groups[1].Value }
          $s = Invoke-RestMethod "http://127.0.0.1:8799/api/scan_engines" -Method Post -Body "{}" -Headers @{"X-Token"=$t}
          $s | Format-Table key, ok, info -AutoSize | Out-String | Write-Host
          $g = Invoke-RestMethod "http://127.0.0.1:8799/api/gematria_value" -Method Post -Body '{"text":"שלום"}' -ContentType "application/json; charset=utf-8" -Headers @{"X-Token"=$t}
          Write-Host "Gematria check: $($g.methods.'Standard (Mispar Hechrachi)')"
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v5
        with:
          name: SeforimStudio-Portable
          path: SeforimStudio-Portable.zip
      - name: Publish as a Release (easy download page)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null; $global:LASTEXITCODE = 0
          $notes = "Portable Seforim Studio for Windows 10/11. Download SeforimStudio-Portable.zip, unzip, read 'START HERE.txt', double-click SeforimStudio.exe. Built from commit ${{ github.sha }}."
          gh release create latest SeforimStudio-Portable.zip --title "Seforim Studio - portable Windows app" --notes "$notes" --target ${{ github.sha }}
