# Builds the portable Windows app, tests the real .exe by clicking through it in Microsoft Edge,
# publishes the test results (branch "ci-results") and the downloads (release "latest").
# Put "[library]" in a commit message (or run manually with build_library) to also rebuild the full library.
name: Build portable Windows exe
on:
  push:
    branches: [main]
    paths-ignore: ["android/**", "tests/android_test.py", "tools/make_android_ai.py", ".github/workflows/build-android.yml"]
  workflow_dispatch:
    inputs:
      build_library:
        description: "Also rebuild the complete pre-downloaded library (takes ~1-3 hours)"
        type: boolean
        default: false
      build_ai:
        description: "Also rebuild the AI pack (Ollama + Qwen3-VL model)"
        type: boolean
        default: false
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Build the portable app
        shell: pwsh
        run: ./build_portable.ps1

      - name: Test the real exe (click through every screen in Edge)
        id: test
        continue-on-error: true
        shell: pwsh
        run: |
          $py = "_build\python\python.exe"
          if (-not (Test-Path $py)) { $py = "python" }
          & $py -m pip install playwright --quiet
          # install exactly the way a user does: run the Setup program (silent mode)
          $inst = Join-Path $env:RUNNER_TEMP "SeforimStudio"
          Start-Process "SeforimStudio-Setup.exe" -ArgumentList "--silent","--dir","$inst","--no-launch" -Wait
          if (-not (Test-Path "$inst\SeforimStudio.exe")) { throw "Setup did not install the app" }
          if (-not (Test-Path "$inst\_internal\python312.dll")) { throw "Setup did not install python312.dll" }
          Write-Host "Setup installed: $((Get-ChildItem $inst -Recurse -File | Measure-Object).Count) files"
          Write-Host "Fonts in app: $((Get-ChildItem "$inst\data\fonts" -Recurse -Filter *.ttf | Measure-Object).Count) ttf files"
          Write-Host "Fonts in Windows (per-user): $((Get-ChildItem "$env:LOCALAPPDATA\Microsoft\Windows\Fonts" -Filter *.ttf -ErrorAction SilentlyContinue | Measure-Object).Count)"
          Write-Host "Desktop shortcut: $(Test-Path "$env:USERPROFILE\Desktop\Seforim Studio.lnk")"
          $data = Join-Path $env:RUNNER_TEMP "testdata"
          Copy-Item "$inst\data" $data -Recurse
          $env:TEST_DATA = $data
          $env:PYTHONIOENCODING = "utf-8"
          & $py tests\windows_ui_test.py "$inst\SeforimStudio.exe" "ci-results"
          if ($LASTEXITCODE -ne 0) { throw "some checks failed - see ci-results/report.md" }

      - name: Error sweep of the real exe (every tool, every screen, every button)
        id: sweep
        continue-on-error: true
        shell: pwsh
        run: |
          $py = "_build\python\python.exe"
          if (-not (Test-Path $py)) { $py = "python" }
          $env:PYTHONIOENCODING = "utf-8"
          $env:SWEEP_EXE = Join-Path $env:RUNNER_TEMP "SeforimStudio\SeforimStudio.exe"
          & $py tests\sweep.py "ci-results\sweep"
          $n = (Get-Content ci-results\sweep\sweep_report.json -Raw | ConvertFrom-Json).Count
          Write-Host "Sweep problems: $n"
          if ($n -gt 0) { throw "the sweep found $n problems - see ci-results/sweep/report.md" }

      - name: Install for ALL users test
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory ci-results -Force | Out-Null
          $dir = Join-Path $env:RUNNER_TEMP "PF\Seforim Studio"
          Start-Process "SeforimStudio-Setup.exe" -ArgumentList "--silent","--allusers","--dir","`"$dir`"","--no-launch","--no-fonts" -Wait
          Write-Host "install.json: $(Get-Content "$dir\install.json" -Raw)"
          Write-Host "shared folder files: $((Get-ChildItem "$env:ProgramData\SeforimStudio" -Recurse -File | Measure-Object).Count)"
          Write-Host "public desktop shortcut: $(Test-Path "$env:PUBLIC\Desktop\Seforim Studio.lnk")"
          $p = Start-Process "$dir\SeforimStudio.exe" -ArgumentList "--no-window","--port","8831" -PassThru
          Start-Sleep 12
          $html = (Invoke-WebRequest "http://127.0.0.1:8831/" -UseBasicParsing).Content
          $tok = [regex]::Match($html, 'TOKEN = "([^"]+)"').Groups[1].Value
          $loc = Invoke-RestMethod -Method Post "http://127.0.0.1:8831/api/locations" -Headers @{ "X-Token" = $tok } -Body "{}"
          Write-Host "locations: $($loc | ConvertTo-Json -Compress)"
          Stop-Process $p
          if (-not $loc.all_users) { throw "all-users mode not active" }
          "all users: OK $($loc | ConvertTo-Json -Compress)" | Set-Content ci-results\allusers.txt

      - name: Keep the Setup for the AI test
        uses: actions/upload-artifact@v5
        with:
          name: setup
          path: SeforimStudio-Setup.exe
          retention-days: 3

      - name: Publish test results (branch ci-results)
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory ci-results -Force | Out-Null
          if (-not (Test-Path ci-results\report.md)) { "The test did not finish - see the build log." | Set-Content ci-results\report.md }
          "${{ github.sha }} $(Get-Date -Format o)" | Set-Content ci-results\built.txt
          $d = Join-Path $env:RUNNER_TEMP "results"
          New-Item -ItemType Directory $d -Force | Out-Null
          Copy-Item ci-results\* $d -Recurse -Force
          Push-Location $d
          git init -q -b ci-results
          git config user.name "build-bot"; git config user.email "build-bot@users.noreply.github.com"
          git add -A; git commit -q -m "Test results for ${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { throw "commit failed" }
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-results
          Pop-Location

      - name: Publish the app (release "latest")
        if: steps.test.outcome == 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          **Seforim Studio - portable Windows app (no install, works offline)**

          1. Download ALL the files below into ONE folder (e.g. Downloads, or a USB stick): **SeforimStudio-Setup.exe**, every **SeforimLibrary.sqlite.xz.part...** (the complete library) and every **SeforimAI.tar.part...** (the AI handwriting reader).
          2. Double-click **SeforimStudio-Setup.exe** -> Install. Setup installs the app, the complete library and the AI handwriting reader in one go (a few minutes), makes a Desktop shortcut and installs the Hebrew fonts into Windows (for Word too).
          3. Then you may delete the part files.
          4. For an OFFLINE computer: copy that same folder of files (USB stick) to it and double-click SeforimStudio-Setup.exe there - no internet needed. Or in the app: Settings > Backup > "Make the complete zip".

          (Alternative: SeforimStudio-Portable.zip - right-click it -> **Extract All** first; do not run the exe from inside the zip.)

          Already inside the app: 50+ Hebrew fonts, the offline dictionary, and the print + cursive (כתב) readers for the scanner. The library is in the Otzaria format, with its commentaries and links.
          Built from commit ${{ github.sha }} - tested automatically on Windows.
          "@
          gh release view latest *> $null
          if ($LASTEXITCODE -ne 0) { gh release create latest --title "Seforim Studio - portable Windows app" --notes "$notes" }
          else { gh release edit latest --notes "$notes" }
          gh release upload latest SeforimStudio-Setup.exe SeforimStudio-Portable.zip --clobber

  library:
    if: (github.event_name == 'workflow_dispatch' && inputs.build_library) || contains(github.event.head_commit.message, '[library]')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: The English translations of the current library (attached to the same seforim)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # all the English translations, fresh (texts only - no links needed)
          python tools/prebuild_library.py --out eng.sqlite --workers 24 > eng.log 2>&1 || tail -20 eng.log
          tail -3 eng.log; ls -la eng.sqlite
      - name: The Otzaria library (seforim + links)
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/Sivan22/otzaria-library.git otz
          cd otz && git sparse-checkout set "אוצריא" "links" && cd ..
          echo "books: $(find otz/אוצריא -name '*.txt' | wc -l)  link files: $(ls otz/links | wc -l)"; du -sh otz/אוצריא otz/links
          ls otz/links | head -3; head -c 600 "$(ls -d otz/links/* | head -1)"; echo
          f=$(find otz/אוצריא -path '*בבלי*' -name '*.txt' | head -1); echo "$f"; head -12 "$f"
      - name: Build the library in the Otzaria format
        run: |
          mkdir -p build
          python tools/build_otzaria_library.py "otz/אוצריא" --links otz/links --english eng.sqlite --out build/library.sqlite
          rm -f eng.sqlite
          python -c "import sqlite3;c=sqlite3.connect('build/library.sqlite');print(c.execute('select count(*) from works').fetchone(), c.execute(\"select count(*) from passages where en<>''\").fetchone(), c.execute('select count(*) from links').fetchone()); [print(r) for r in c.execute(\"select ref,substr(he,1,40),substr(en,1,40) from passages where ref like 'Berakhot 2a:%' limit 4\")]" | tee build/library_report.txt
      - name: Compress and split (GitHub allows 2 GB per file)
        run: |
          cd build
          ls -la
          xz -T0 -6 -k -c library.sqlite > SeforimLibrary.sqlite.xz
          ls -la SeforimLibrary.sqlite.xz
          split -b 1900M -d -a 1 SeforimLibrary.sqlite.xz part_
          n=$(ls part_* | wc -l); i=1
          for f in $(ls part_* | sort); do mv "$f" "SeforimLibrary.sqlite.xz.part${i}of${n}"; i=$((i+1)); done
          rm SeforimLibrary.sqlite.xz
          ls -la
      - name: Publish the library (release "latest")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest > /dev/null 2>&1 || gh release create latest --title "Seforim Studio - portable Windows app" --notes "Building…"
          for a in $(gh release view latest --json assets -q '.assets[].name' | grep -E '^SeforimLibrary|^SeforimMore' || true); do gh release delete-asset latest "$a" -y; done
          gh release upload latest build/SeforimLibrary.sqlite.xz.part* build/library_report.txt --clobber

  bigtest:
    # the error sweep on the COMPLETE library (all 6,468 seforim): finds slow or failing features
    needs: [library]
    if: always() && needs.library.result != 'failure' && (contains(github.event.head_commit.message, '[bigtest]') || contains(github.event.head_commit.message, '[library]'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost; df -h /
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the complete library
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download latest --pattern 'SeforimLibrary.sqlite.xz.part*' -D parts --repo ${{ github.repository }}
          mkdir -p bigdata; cat $(ls parts/* | sort) | xz -d -T0 > bigdata/library.sqlite; rm -rf parts
          cp data/seforim_catalog.db bigdata/; ls -la bigdata
      - name: Sweep
        run: |
          pip install -q -r requirements.txt playwright || pip install -q playwright
          python -m playwright install --with-deps chromium > /dev/null
          SWEEP_DATA=$PWD/bigdata python tests/sweep.py big-results || true
          cat big-results/report.md | head -150
      - name: Publish (branch ci-results-big)
        if: always()
        run: |
          mkdir -p big-results; cd big-results; rm -f *.png server_log.txt
          git init -q -b ci-results-big; git config user.name build-bot; git config user.email build-bot@users.noreply.github.com
          git add -A; git commit -q -m "Big library sweep ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-results-big

  more:
    # the "more seforim" pack from the Otzaria library - put "[more]" in the commit message
    if: contains(github.event.head_commit.message, '[more]')
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost; df -h /
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Get the Otzaria library (books only)
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/Sivan22/otzaria-library.git otz
          cd otz && git sparse-checkout set "אוצריא" && cd ..
          find otz/אוצריא -name "*.txt" | wc -l; du -sh otz/אוצריא
          ls otz/אוצריא
      - name: Build the pack (skips seforim the main library already has)
        run: python tools/import_otzaria.py "otz/אוצריא" --out build/more.sqlite
      - name: Compress, split, publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build; ls -la
          xz -T0 -6 -c more.sqlite > SeforimMore.sqlite.xz; rm more.sqlite
          split -b 1900M -d -a 1 SeforimMore.sqlite.xz part_
          n=$(ls part_* | wc -l); i=1
          for f in $(ls part_* | sort); do mv "$f" "SeforimMore.sqlite.xz.part${i}of${n}"; i=$((i+1)); done
          rm SeforimMore.sqlite.xz; ls -la
          R="--repo ${{ github.repository }}"
          for a in $(gh release view latest $R --json assets -q '.assets[].name' | grep '^SeforimMore' || true); do gh release delete-asset latest "$a" -y $R; done
          gh release upload latest SeforimMore.sqlite.xz.part* more_report.txt --clobber $R

  cursive:
    # trains the offline reader for Hebrew cursive handwriting (כתב) - put "[cursive]" in the commit message
    if: contains(github.event.head_commit.message, '[cursive]')
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
      - name: Tools, fonts, text
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr culmus fonts-noto-core > /dev/null || sudo apt-get install -y -qq tesseract-ocr > /dev/null
          pip install -q pillow numpy python-bidi
          mkdir -p work/fonts work/tessdata && cd work
          curl -fsSL -o tessdata/heb.traineddata https://github.com/tesseract-ocr/tessdata_best/raw/main/heb.traineddata
          curl -fsSL -o heb.txt https://raw.githubusercontent.com/tesseract-ocr/langdata_lstm/main/heb/heb.training_text
          git clone -q --depth 1 https://github.com/AlefAlefAlef/gveret-levin.git f1 || true
          git clone -q --depth 1 https://github.com/aharonium/fonts.git f2 || true
          git clone -q --depth 1 https://github.com/tesseract-ocr/tesstrain.git
          find f1 f2 /usr/share/fonts -type f -iregex '.*\(ktav\|yad\|gveret\|levin\|dana\|anka\|refoyl\|nachlaot\|shmulik\|ellinia.*it\|dorian.*it\).*\.\(ttf\|otf\)' | sort -u > fontlist.txt
          cat fontlist.txt
          while IFS= read -r f; do cp "$f" "fonts/$(basename "$f" | tr ' ' _)"; done < fontlist.txt
          ls fonts
      - name: Make 24,000 handwriting-style training lines
        run: |
          cd work
          python ../tools/make_script_gt.py --fonts fonts/* --corpus heb.txt --out tesstrain/data/heb_script-ground-truth --lines 24000
          python ../tools/make_script_gt.py --fonts fonts/* --corpus heb.txt --out heldout --lines 300 --seed 99
      - name: Train (fine-tune the Hebrew model on cursive)
        run: |
          cd work/tesstrain
          make -j4 lists MODEL_NAME=heb_script START_MODEL=heb TESSDATA=$PWD/../tessdata LANG_TYPE=RTL PSM=7 > lists.log 2>&1 || (tail -40 lists.log; exit 1)
          make training MODEL_NAME=heb_script START_MODEL=heb TESSDATA=$PWD/../tessdata LANG_TYPE=RTL PSM=7 MAX_ITERATIONS=20000 2>&1 | grep -E "At iteration|Finished|error|Error" | awk 'NR%20==1 || /Finished|rror/'
          ls -la data/ | head
          lstmtraining --stop_training --convert_to_int --continue_from data/heb_script/checkpoints/heb_script_checkpoint \
            --traineddata data/heb_script/heb_script.traineddata --model_output ../tessdata/heb_script.traineddata || cp data/heb_script.traineddata ../tessdata/
          ls -la ../tessdata
      - name: Test
        run: |
          cd work
          python ../tools/eval_script.py tessdata heldout report.md ../tests/data/cursive_alphabet.png ../tests/data/handwriting_sample.jpg ../tests/data/messy_handwriting.png
      - name: Publish the model (branch models-cursive)
        if: always()
        run: |
          mkdir -p out; cp work/tessdata/heb_script.traineddata out/ 2>/dev/null; cp work/report.md work/fontlist.txt out/ 2>/dev/null; cd out
          git init -q -b models-cursive; git config user.name build-bot; git config user.email build-bot@users.noreply.github.com
          git add -A; git commit -q -m "Cursive model ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" models-cursive

  ai:
    # "[ai]" = the standard AI pack (4B) on the main download page; "[ai8b]" = the bigger, more accurate 8B pack on its own page
    if: (github.event_name == 'workflow_dispatch' && inputs.build_ai) || contains(github.event.head_commit.message, '[ai]') || contains(github.event.head_commit.message, '[ai8b]')
    runs-on: ubuntu-latest
    env:
      MODEL: ${{ contains(github.event.head_commit.message, '[ai8b]') && 'qwen3-vl:8b-instruct' || 'qwen3-vl:4b-instruct' }}
      TAG: ${{ contains(github.event.head_commit.message, '[ai8b]') && 'ai-8b' || 'latest' }}
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost; df -h /
      - uses: actions/checkout@v5
      - name: Ollama for Windows (official release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dl pack/ai/ollama pack/ai/models
          gh release download --repo ollama/ollama --pattern 'ollama-windows-amd64.zip' -D dl
          unzip -q dl/ollama-windows-amd64.zip -d pack/ai/ollama
          ls pack/ai/ollama; du -sh pack/ai/ollama
      - name: Download the AI model (Qwen3-VL 4B)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true
          export OLLAMA_MODELS=$PWD/pack/ai/models
          (ollama serve > serve.log 2>&1 &)
          sleep 5
          ollama pull $MODEL || ollama pull qwen3-vl:4b
          ollama list
          du -sh pack/ai/models
          pkill ollama || true
      - name: Check the AI really reads (with the app's own scanner code, before publishing)
        run: |
          pip install -q opencv-python-headless numpy
          pkill ollama || true; sleep 2
          export OLLAMA_MODELS=$PWD/pack/ai/models
          (ollama serve > serve2.log 2>&1 &); sleep 6
          ollama list
          python - <<'P'
          import sys, time; sys.path.insert(0, ".")
          from scanner import engines
          e = engines.OllamaEngine()
          print("model:", e.pick_model(), flush=True)
          t0 = time.time()
          t = e.read_image(engines.imread("tests/data/handwriting_sample.jpg"))
          print(f"read in {int(time.time()-t0)} s:\n{t}", flush=True)
          if len(t.strip()) < 20:
              sys.exit("The AI gave no text - not publishing this pack")
          P
          pkill ollama || true
      - name: Pack and split (GitHub allows 2 GB per file)
        run: |
          mkdir -p out
          cd pack && tar -cf - ai | split -b 1900M -d -a 1 - ../out/p_ && cd ..
          cd out; n=$(ls p_* | wc -l); i=1
          for f in $(ls p_* | sort); do mv "$f" "SeforimAI.tar.part${i}of${n}"; i=$((i+1)); done
          # the parts join into a whole, readable archive (no errors inside)
          cat $(ls SeforimAI.tar.part* | sort -V) | tar -tf - > /dev/null && echo "archive OK: $(cat $(ls SeforimAI.tar.part* | sort -V) | tar -tf - | wc -l) files"
          sha256sum SeforimAI.tar.part* > SeforimAI.sha256; cat SeforimAI.sha256
          ls -la
      - name: Publish the AI pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="--repo ${{ github.repository }}"
          if [ "$TAG" = "latest" ]; then N="Seforim Studio - portable Windows app"; else N="AI handwriting reader - bigger, more accurate (8B)"; fi
          gh release view $TAG $R > /dev/null 2>&1 || gh release create $TAG $R --title "$N" --notes "Put the SeforimAI.tar.part files into the Seforim Studio app folder (where SeforimStudio.exe is), then Scanner -> Install AI pack. Model: $MODEL"
          for a in $(gh release view $TAG $R --json assets -q '.assets[].name' | grep '^SeforimAI' || true); do gh release delete-asset $TAG "$a" -y $R; done
          gh release upload $TAG out/SeforimAI.tar.part* out/SeforimAI.sha256 --clobber $R

  ai-test:
    needs: [windows, ai]
    if: always() && needs.windows.result == 'success' && !contains(github.event.head_commit.message, '[ai8b]') && (needs.ai.result == 'success' || contains(github.event.head_commit.message, '[ai-test]'))
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: setup
          path: setup
      - name: Download the AI pack from the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download latest --pattern 'SeforimAI.tar.part*' -D aiparts --repo ${{ github.repository }}
      - name: Install like a user and read handwriting with the AI
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          python tests\ai_windows_test.py setup\SeforimStudio-Setup.exe aiparts ai-results
      - name: Publish AI test results (branch ci-results-ai)
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory ai-results -Force | Out-Null
          if (-not (Test-Path ai-results\ai_report.md)) { "AI test did not finish - see the build log." | Set-Content ai-results\ai_report.md }
          $d = Join-Path $env:RUNNER_TEMP "air"; New-Item -ItemType Directory $d -Force | Out-Null
          Copy-Item ai-results\* $d -Recurse -Force; Push-Location $d
          git init -q -b ci-results-ai; git config user.name "build-bot"; git config user.email "build-bot@users.noreply.github.com"
          git add -A; git commit -q -m "AI test ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-results-ai
          Pop-Location
