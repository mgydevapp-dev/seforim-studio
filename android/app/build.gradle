plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

def appVersion = (System.getenv("APP_VERSION_CODE") ?: "1") as int

android {
    namespace "org.seforimstudio.app"
    compileSdk 34
    defaultConfig {
        applicationId "org.seforimstudio.app"
        minSdk 26
        targetSdk 34
        versionCode appVersion
        versionName "1." + appVersion
        ndk { abiFilters "arm64-v8a", "x86_64" }
    }
    signingConfigs {
        seforim {
            storeFile file("../seforim.keystore")
            storePassword "seforim123"
            keyAlias "seforim"
            keyPassword "seforim123"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.seforim
        }
        debug { signingConfig signingConfigs.seforim }
    }
    // the AI program (llama-server, built for Android as libllama_server.so) must be unpacked to be started
    packagingOptions { jniLibs { useLegacyPackaging true } }
    sourceSets { main { assets.srcDirs += ["build/generated/appzip"] } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version "3.10"
        pip {
            install "numpy==1.26.2"
            install "opencv-python==4.5.1.48"
            install "pillow"
            install "pyluach"
            install "python-docx"
        }
    }
}

dependencies {
    implementation "androidx.core:core:1.12.0"
}

// The whole desktop app (Python engine + web pages + catalog + dictionary) goes into the APK as app.zip;
// it is unpacked on the phone at first start and after every update.
def repo = rootProject.projectDir.parentFile
tasks.register("appZip", Zip) {
    archiveFileName = "app.zip"
    destinationDirectory = file("build/generated/appzip")
    from(repo) {
        include "core/**", "scanner/**", "plugins/**", "web/**", "data/seforim_catalog.db", "langdata/lang.sqlite"
        exclude "**/__pycache__/**", "**/*.pyc", "scanner/models/*.mlmodel"
    }
}
preBuild.dependsOn "appZip"
